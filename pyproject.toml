[project]
name = "seqout-ingestion-v2"
version = "0.1.0"
description = "seqout ingestion toolkit"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "fastparquet>=2026.5.0",
    "geopy>=2.4.1",
    "pycountry>=24.6.1",
    "humanfriendly>=10.0",
    "libarchive-c>=5.3",
    "lmdb>=2.2.1",
    "lxml>=7.0.0a1",
    "pysradb",
    "requests>=2.34.2",
    "tqdm>=4.67.3",
    "typer>=0.26.7",
    "h5py>=3.16.0",
    "pyreadr>=0.5.6",
    "lxml-stubs>=0.5.1",
]

[tool.uv]
override-dependencies = [
    "lxml>=7.0.0a1",
]

[tool.uv.sources]
pysradb = { git = "https://github.com/saketkc/pysradb.git", rev = "develop" }
