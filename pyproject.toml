[project]
name = "seqout-ingestion-v2"
version = "0.1.0"
description = "seqout ingestion toolkit"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "geopy>=2.4.1",
    "pycountry>=24.6.1",
    "humanfriendly>=10.0",
    "libarchive-c>=5.3",
    "lxml>=7.0.0a1",
    "pysradb",
    "tqdm>=4.67.3",
    "typer>=0.26.7",
    "h5py>=3.16.0",
    "pyreadr>=0.5.6",
    "psycopg>=3.3.4",
    "results>=1.4.1772627293",
    "testing-postgresql>=1.3.0",
    "pyarrow>=24.0.0",
    "rpy2>=3.6.7",
    "httpx>=0.28.1",
    "rapidfuzz>=3.14.5",
    "numpy>=2.3.0rc1"
]

[tool.uv.sources]
pysradb = { git = "https://github.com/0xmukesh/pysradb.git", rev = "develop" }

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "ANN401",
    "BLE001",
    "C901", "COM812",
    "D100", "D101", "D103", "D104", "D203", "D212",
    "EM102",
    "FBT001",
    "PLR0913", "PLR0912", "PLR0915",
    "TRY003", "TRY301",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[dependency-groups]
dev = [
    "lxml-stubs>=0.5.1",
    "ruff>=0.11.8",
    "pre-commit>=4.2.0",
    "tox",
    "tox-uv"
]
