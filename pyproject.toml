[project]
name = "seqout-ingestion"
version = "0.1.0"
description = "seqout ingestion toolkit"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "geopy>=2.4.1",
    "pycountry>=24.6.1",
    "humanfriendly>=10.0",
    "libarchive-c>=5.3",
    "lxml>=7.0.0a1",
    "neo4j>=5.28.0",
    "openpyxl>=3.1.5",
    "tqdm>=4.67.3",
    "typer>=0.26.7",
    "h5py>=3.16.0",
    "psycopg[binary]>=3.3.4",
    "results>=1.4.1772627293",
    "testing-postgresql>=1.3.0",
    "pyarrow>=19.0.0,<24",
    "httpx>=0.28.1",
    "rapidfuzz>=3.14.5",
    "numpy>=2.3.0rc1",
    "pysocks>=1.7.1",
    "pysradb",
    "yuj",
]

[project.optional-dependencies]
# R bridge, only for the sc_enrich .rds readers. needs a system R install.
rds = [
    "rpy2>=3.6.7",
    "pyreadr>=0.5.6",
]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "ANN401",
    "BLE001", "B008",
    "C901", "COM812",
    "D100", "D101", "D103", "D104", "D203", "D212",
    "EM102",
    "FBT001",
    "PLR0913", "PLR0912", "PLR0915", "PLC0415",
    "TRY003", "TRY301",
]

[tool.ruff.lint.per-file-ignores]
# __main__ self-checks legitimately use bare asserts / print / magic values.
"src/ingest/gsa_bioproject.py" = ["S101", "T201", "PLR2004", "PT018"]
"src/age/parser.py" = ["S101", "T201", "PLR2004", "FBT003", "PLR0911", "PT018"]
# tests assert (S101), are not a package (INP001), and paste real archive
# records verbatim as fixtures -- which are long lines (E501) with magic values.
"tests/*" = ["S101", "INP001", "E501", "PLR2004", "PT017", "FLY002", "D", "ANN"]
"recipes/*" = ["INP001", "BLE001", "T201"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.uv.sources]
# pysradb tracks `develop`, NOT PyPI. The released 2.5.x has no `SRAweb.pmid_info`,
# which backfill/pubmed_meta.py and refresh/publications.py both call. Moving this
# to a PyPI version pin breaks the publication metadata step at runtime, not at
# install time -- so it looks fine until a refresh run dies.
pysradb = { git = "https://github.com/saketkc/pysradb.git", rev = "develop" }
# Uninitialised submodule => empty dir => `uv sync` fails on this path.
# `git submodule update --init --recursive` first.
yuj = { path = "./vendor/yuj" }

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "lxml-stubs>=0.5.1",
    "ruff>=0.11.8",
    "pre-commit>=4.2.0",
    "pytest>=8.0.0",
    "tox",
    "tox-uv"
]

cuda = [
    "torch>=2.11.0",
    "chromadb>=1.5.5",
    "sentence-transformers[onnx]>=5.3.0",
    "cuml-cu13==26.6.*",
    "scikit-learn>=1.8.0",
    "openai>=2.30.0",
    "matplotlib>=3.11.0",
    "evoc>=0.3.1",
    "langchain-text-splitters>=1.1.1",
    "python-igraph>=1.0.0",
    "leidenalg>=0.12.0",
]
