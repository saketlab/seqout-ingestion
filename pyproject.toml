[project]
name = "seqout-ingestion-v2"
version = "0.1.0"
description = "seqout ingestion toolkit"
readme = "readme.md"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "humanfriendly>=10.0",
    "libarchive-c>=5.3",
    "pysradb",
    "requests>=2.34.2",
    "tqdm>=4.67.3",
]

[tool.uv]
override-dependencies = [
    "lxml==7.0.0a1",
]

[tool.uv.sources]
pysradb = { git = "https://github.com/0xMukesh/pysradb.git", rev = "enrichment" }
