[project]
name = "seqout-ingestion-v2"
version = "0.1.0"
description = "seqout ingestion toolkit"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "geopy>=2.4.1",
    "pycountry>=24.6.1",
    "humanfriendly>=10.0",
    "libarchive-c>=5.3",
    "lxml>=7.0.0a1",
    "pysradb",
    "requests>=2.34.2",
    "tqdm>=4.67.3",
    "typer>=0.26.7",
    "h5py>=3.16.0",
    "pyreadr>=0.5.6",
    "psycopg>=3.3.4",
    "results>=1.4.1772627293",
    "testing-postgresql>=1.3.0",
    "pyarrow>=24.0.0",
    "rpy2>=3.6.7",
]

[tool.uv.sources]
pysradb = { git = "https://github.com/saketkc/pysradb.git", rev = "develop" }

[dependency-groups]
dev = [
    "lxml-stubs>=0.5.1",
]
